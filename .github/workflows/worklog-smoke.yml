name: Worklog Connection Check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: worklog/package-lock.json
      - uses: google-github-actions/auth@v3
        id: google-auth
        with:
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/spreadsheets
      - name: Build and check connections (read only)
        env:
          WORKLOG_GITHUB_TOKEN: ${{ secrets.WORKLOG_GITHUB_TOKEN || github.token }}
          GITHUB_PROJECT_NUMBER: ${{ vars.GITHUB_PROJECT_NUMBER }}
          GITHUB_PROJECT_OWNER: ${{ vars.GITHUB_PROJECT_OWNER }}
          GITHUB_PROJECT_OWNER_TYPE: ${{ vars.GITHUB_PROJECT_OWNER_TYPE }}
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ vars.GOOGLE_SHEETS_SPREADSHEET_ID }}
          GOOGLE_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          WORKLOG_TIMEZONE: Asia/Tokyo
        run: |
          cd worklog
          npm ci
          npm run build
          node dist/src/smoke.js
